# Jaeger v2 all-in-one under systemd on the host (systemd/jaeger.service). Everything listens on the docker bridge gateway
# 172.30.0.1 only (containers reach it as `jaeger`, via --add-host jaeger:172.30.0.1; host nginx proxies the UI). OTLP in
# (4317 gRPC, 4318 HTTP), UI/API on 16686, traces kept in memory (the last 5000 only, lost on restart).
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs: { level: warn }

extensions:
  jaeger_query:
    storage: { traces: memstore }
    http: { endpoint: 172.30.0.1:16686 }
    grpc: { endpoint: 172.30.0.1:16685 }
  jaeger_storage:
    backends:
      memstore:
        memory: { max_traces: 5000 }

receivers:
  otlp:
    protocols:
      grpc: { endpoint: 172.30.0.1:4317 }
      http: { endpoint: 172.30.0.1:4318 }

processors:
  batch: {}

exporters:
  jaeger_storage_exporter:
    trace_storage: memstore
