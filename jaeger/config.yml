service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs: { level: warn }
extensions:
  jaeger_query:
    storage: { traces: memstore }
  jaeger_storage:
    backends:
      memstore:
        memory: { max_traces: 20000 }
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
processors:
  batch: {}
exporters:
  jaeger_storage_exporter:
    trace_storage: memstore
