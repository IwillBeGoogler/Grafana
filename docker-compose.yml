# Lean monitoring stack for IWillBeGoogler. Joins the app network (iwillbegoogler_default) and scrapes it.
# Memory budget: ~800M total.
name: iwillbegoogler-monitoring

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "2" }
  networks: [app]

services:
  prometheus:
    <<: *common
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.retention.size=300MB
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver # Tempo's metrics generator pushes service-graph metrics
    environment:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 90MiB
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./emqx_secret:/etc/prometheus/emqx_secret:ro
      - prometheusdata:/prometheus
    deploy: { resources: { limits: { memory: 112M, cpus: "0.5" } } }

  grafana:
    <<: *common
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (cp .env.example .env)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      # same Telegram bot and chat as CI/CD and Alertmanager; the placeholder keeps provisioning valid until .env is filled
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-set-me-in-env}
      GF_LOG_LEVEL: warn
      GOMAXPROCS: "1"
      GOMEMLIMIT: 128MiB
    ports: ["127.0.0.1:${GRAFANA_PORT:-3200}:3000"]
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki, tempo]
    deploy: { resources: { limits: { memory: 160M, cpus: "0.5" } } }

  alertmanager:
    <<: *common
    image: prom/alertmanager:v0.34.2
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=72h
      - --cluster.listen-address= # single node: no HA gossip
    ports: ["127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./telegram_token:/etc/alertmanager/telegram_token:ro
      - alertmanagerdata:/alertmanager
    deploy: { resources: { limits: { memory: 32M, cpus: "0.1" } } }

  otel-collector:
    <<: *common
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: [--config=/etc/otelcol/config.yml]
    environment:
      GOMEMLIMIT: 56MiB
    volumes:
      - ./otel/config.yml:/etc/otelcol/config.yml:ro
    depends_on: [loki, tempo]
    deploy: { resources: { limits: { memory: 64M, cpus: "0.3" } } }

  tempo:
    <<: *common
    image: grafana/tempo:3.1.1
    command: [-config.file=/etc/tempo/tempo.yml]
    environment:
      GOMEMLIMIT: 200MiB
    ports: ["127.0.0.1:${TEMPO_PORT:-3201}:3200"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempodata:/var/tempo
    depends_on: [prometheus]
    deploy: { resources: { limits: { memory: 256M, cpus: "0.5" } } }

  loki:
    <<: *common
    image: grafana/loki:3.7.9
    command: [-config.file=/etc/loki/loki.yml]
    environment:
      GOMEMLIMIT: 90MiB
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    deploy: { resources: { limits: { memory: 112M, cpus: "0.3" } } }

  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.loadavg
      - --collector.netdev
      - --collector.diskstats
      - --collector.uname
    pid: host
    volumes: ["/:/host:ro"]
    deploy: { resources: { limits: { memory: 24M, cpus: "0.1" } } }

  postgres-exporter:
    <<: *common
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgres://blog:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (cp .env.example .env)}@postgres:5432/blog?sslmode=disable
    command: [--no-collector.wal, --no-collector.stat_bgwriter]
    deploy: { resources: { limits: { memory: 24M, cpus: "0.1" } } }

  redis-exporter:
    <<: *common
    image: oliver006/redis_exporter:v1.97.0-alpine
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    deploy: { resources: { limits: { memory: 16M, cpus: "0.1" } } }

networks:
  app:
    external: true
    name: ${APP_NETWORK:-iwillbegoogler_default}

volumes:
  prometheusdata:
  grafanadata:
  alertmanagerdata:
  lokidata:
  tempodata:
