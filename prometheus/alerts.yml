groups:
  - name: iwillbegoogler-diagrams
    interval: 30s
    rules:
      - alert: YjsBatchWriteFailing
        expr: "increase(iwillbegoogler_yjs_batch_write_failures_total[5m]) > 0"
        for: 300s
        labels:
          severity: critical
        annotations:
          description: "Collaborative edits are not reaching Postgres; check DB health and API logs."
          summary: "Yjs batch writes failing on {{ $labels.instance }}"
      - alert: YjsStoredUpdatesHigh
        expr: "histogram_quantile(0.95, sum by (le) (rate(iwillbegoogler_yjs_stored_updates_bucket[10m]))) > 100"
        for: 1800s
        labels:
          severity: warning
        annotations:
          description: "Compaction is not keeping up (default threshold 50). See iwillbegoogler_yjs_compactions_refused_total."
          summary: "p95 stored Yjs updates above 2x compact threshold"
      - alert: DiagramApi5xxRate
        expr: "sum(rate(http_requests_total{route=~\".*/api/diagrams.*\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total{route=~\".*/api/diagrams.*\"}[5m])), 0.000000001) > 0.02"
        for: 600s
        labels:
          severity: critical
        annotations:
          summary: "More than 2% of /api/diagrams requests return 5xx"
      - alert: YjsCompactionsRefusedSpike
        expr: "increase(iwillbegoogler_yjs_compactions_refused_total[15m]) > 10"
        for: 600s
        labels:
          severity: warning
        annotations:
          description: "Snapshots do not cover all stored updates; clients may be sending stale snapshots."
          summary: "Yjs compactions are being refused"
      - alert: WebhookFailuresHigh
        expr: "sum(rate(iwillbegoogler_webhook_attempts_total{result!=\"2xx\"}[15m])) / clamp_min(sum(rate(iwillbegoogler_webhook_attempts_total[15m])), 0.000000001) > 0.5"
        for: 900s
        labels:
          severity: warning
        annotations:
          description: "See iwillbegoogler_webhook_attempts_total by result; a single broken endpoint can cause this."
          summary: "More than half of webhook attempts are failing"
  - name: infra
    interval: 30s
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.instance }}) is down"
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Less than 10% memory available"
      - alert: HostDiskLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|erofs|squashfs|iso9660"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|erofs|squashfs|iso9660"} < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} below 10% free"
      - alert: HostCpuHigh
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU above 90% for 15m"
