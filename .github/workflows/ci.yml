name: CI

# Validates every config of the monitoring stack before it can be deployed: compose file, Prometheus config and rules,
# Alertmanager, OTel collector, Tempo (an end-to-end trace), and a Grafana start with the provisioning (datasources, alerting).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      notify: { type: boolean, default: true, description: "send the Telegram message (cd.yml sends its own)" }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # placeholders so the mounts exist; real values live on the server
  PROM_IMAGE: prom/prometheus:v3.5.0
  AM_IMAGE: prom/alertmanager:v0.28.1
  OTEL_IMAGE: otel/opentelemetry-collector-contrib:0.131.0

jobs:
  compose:
    name: Compose file
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          cp .env.example .env
          touch emqx_secret telegram_token
          docker compose config -q

  prometheus:
    name: Prometheus config and rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          # prometheus.yml points at a secret file that only exists on the server
          cp -r prometheus "$RUNNER_TEMP/prom" && touch "$RUNNER_TEMP/prom/emqx_secret"
          docker run --rm --entrypoint promtool -v "$RUNNER_TEMP/prom:/etc/prometheus:ro" \
            "$PROM_IMAGE" check config /etc/prometheus/prometheus.yml

  alertmanager:
    name: Alertmanager config and routing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash .github/scripts/check-alertmanager.sh

  tracing:
    name: OTel collector and Tempo (end to end)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker run --rm -v "$PWD/otel/config.yml:/c.yml:ro" "$OTEL_IMAGE" validate --config /c.yml
      # starts both with the repo's configs, sends a span to the collector and reads it back from Tempo
      - run: bash .github/scripts/check-tracing.sh

  grafana:
    name: Grafana provisioning
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash .github/scripts/check-grafana.sh

  notify:
    needs: [compose, prometheus, alertmanager, tracing, grafana]
    if: always() && inputs.notify != false
    permissions:
      contents: read
      actions: read # _notify reads job results and logs
    uses: ./.github/workflows/_notify.yml
    with:
      environment: ${{ github.base_ref == 'main' && 'production' || 'dev' }}
      mode: ci
      results: ${{ toJSON(needs) }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
