# Tempo, single binary, traces on local disk (volume /var/tempo), kept 48h. OTLP in on 4317 (gRPC) and 4318 (HTTP) from the
# collector only; the query API (Grafana's Tempo datasource) is on 3200. Single binary runs the ring with replication 1.
# The metrics generator turns spans into service-graph and span metrics and pushes them to Prometheus (remote write receiver).
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }
ingester:
  max_block_duration: 5m
metrics_generator:
  registry:
    external_labels: { source: tempo }
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs: {}
    span_metrics: {}
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
compactor:
  compaction:
    block_retention: 48h
storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }
