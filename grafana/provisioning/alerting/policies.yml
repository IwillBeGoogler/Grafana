apiVersion: 1
# Every Grafana-managed alert goes to Telegram. Prometheus rules (prometheus/alerts.yml) keep going through Alertmanager,
# which Grafana shows as the "Alertmanager" datasource.
policies:
  - orgId: 1
    receiver: telegram
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
